<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Shelf</title>
    <link rel="stylesheet" href="/style.css" />
    <script type="module" src="/app.js"></script>
  </head>
  <body>
    <main>
      <h1>Shelf</h1>

      <section aria-labelledby="add-heading">
        <h2 id="add-heading">Add an item</h2>
        <form id="add-form" autocomplete="off">
          <label>Title <input name="title" required /></label>
          <label>Author or source <input name="author" /></label>
          <label>URL <input name="url" type="url" placeholder="https://" /></label>
          <div class="row">
            <label>Kind
              <select name="kind">
                <option value="book">Book</option>
                <option value="article">Article</option>
              </select>
            </label>
            <label>Status
              <select name="status">
                <option value="to_read">To read</option>
                <option value="reading">Reading</option>
                <option value="done">Done</option>
              </select>
            </label>
            <label>Rating
              <select name="rating">
                <option value="">None</option>
                <option value="1">1</option>
                <option value="2">2</option>
                <option value="3">3</option>
                <option value="4">4</option>
                <option value="5">5</option>
              </select>
            </label>
          </div>
          <label>Tags <input name="tags" placeholder="sci-fi, history" /></label>
          <label>Notes <textarea name="notes" rows="3"></textarea></label>
          <button type="submit">Add</button>
          <div id="add-error" class="error" role="alert" hidden></div>
        </form>
      </section>

      <section aria-labelledby="list-heading">
        <h2 id="list-heading">Your shelf</h2>
        <div id="message" class="error" role="alert" hidden></div>
        <ul id="items"></ul>
      </section>
    </main>
  </body>
</html>
