<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Shelf</title>
    <link rel="stylesheet" href="/style.css" />
    <script type="module" src="/app.js"></script>
  </head>
  <body>
    <main>
      <h1>Shelf</h1>

      <section aria-labelledby="add-heading">
        <h2 id="add-heading">Add an item</h2>
        <form id="add-form" autocomplete="off">
          <label>Title <input name="title" required /></label>
          <label>Author or source <input name="author" /></label>
          <label>URL <input name="url" type="url" placeholder="https://" /></label>
          <div class="row">
            <label>Kind
              <select name="kind">
                <option value="book">Book</option>
                <option value="article">Article</option>
              </select>
            </label>
            <label>Status
              <select name="status">
                <option value="to_read">To read</option>
                <option value="reading">Reading</option>
                <option value="done">Done</option>
              </select>
            </label>
            <label>Rating
              <select name="rating">
                <option value="">None</option>
                <option value="1">1</option>
                <option value="2">2</option>
                <option value="3">3</option>
                <option value="4">4</option>
                <option value="5">5</option>
              </select>
            </label>
          </div>
          <label>Tags <input name="tags" placeholder="sci-fi, history" /></label>
          <label>Notes <textarea name="notes" rows="3"></textarea></label>
          <button type="submit">Add</button>
          <div id="add-error" class="error" role="alert" hidden></div>
        </form>
      </section>

      <section aria-labelledby="list-heading">
        <h2 id="list-heading">Your shelf</h2>
        <form id="filters" role="search" autocomplete="off">
          <label>Search <input name="q" type="search" placeholder="Title, author, notes or tag" /></label>
          <div class="row">
            <label>Status
              <select name="status">
                <option value="">Any</option>
                <option value="to_read">To read</option>
                <option value="reading">Reading</option>
                <option value="done">Done</option>
              </select>
            </label>
            <label>Kind
              <select name="kind">
                <option value="">Any</option>
                <option value="book">Book</option>
                <option value="article">Article</option>
              </select>
            </label>
            <label>Tag
              <select name="tag">
                <option value="">All tags</option>
              </select>
            </label>
            <label>Min rating
              <select name="min_rating">
                <option value="">Any</option>
                <option value="1">1+</option>
                <option value="2">2+</option>
                <option value="3">3+</option>
                <option value="4">4+</option>
                <option value="5">5</option>
              </select>
            </label>
          </div>
          <button type="button" id="clear-filters" class="secondary">Clear filters</button>
        </form>
        <div id="message" class="error" role="alert" hidden></div>
        <ul id="items"></ul>
      </section>

      <section id="stats" aria-labelledby="stats-heading">
        <h2 id="stats-heading">Reading stats</h2>
        <div id="stats-body"></div>
      </section>

      <section aria-labelledby="files-heading">
        <h2 id="files-heading">Import and export</h2>
        <div class="row">
          <a class="button secondary" href="/api/export?format=json" download>Export JSON</a>
          <a class="button secondary" href="/api/export?format=csv" download>Export CSV</a>
          <a class="button secondary" href="/api/export?format=md" download>Export Markdown</a>
        </div>
        <form id="import-form">
          <label>Import a file exported from Shelf <input name="file" type="file" accept=".json,.csv" /></label>
          <button type="submit">Import</button>
        </form>
        <div id="import-result" role="status" aria-live="polite"></div>
      </section>
    </main>
  </body>
</html>
